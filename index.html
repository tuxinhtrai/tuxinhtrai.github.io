<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild Bounty Showdown - Demo Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0c0603;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .game-wrapper {
      width: 100%;
      max-width: 480px; /* Giới hạn khung chiều rộng chuẩn di động */
      height: 100%;
      max-height: 100vh;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <!-- Thay link bên dưới bằng đường dẫn iframe thực tế của game demo -->
    <iframe src="https://www.gamesville.com/slots/wild-bounty-showdown" allowfullscreen></iframe>
  </div>

</body>
</html>
