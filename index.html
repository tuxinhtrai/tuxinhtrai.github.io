<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild Bounty Showdown - Custom Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle, #3a1e0b 0%, #0c0603 100%);
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Tiêu đề trang trí bên trên */
    .game-header {
      text-align: center;
      margin-bottom: 10px;
    }

    .game-header h1 {
      font-size: 22px;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px #000;
    }

    /* Khung máy game bao bọc bên ngoài (Cái khung để che phần thừa) */
    .arcade-cabinet {
      position: relative;
      width: 400px;
      height: 680px;
      background: #150a04;
      border: 4px solid #b8860b;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.4);
      overflow: hidden;
    }

    /* Lớp phủ ẩn bớt phần thừa và căn chỉnh iframe lọt vào khung */
    .game-screen {
      position: absolute;
      top: -90px; /* Điều chỉnh số âm này lên/xuống để dịch chuyển màn hình game vào giữa khung */
      left: 0;
      width: 100%;
      height: calc(100% + 180px);
      border: none;
    }

    /* Dòng chữ trang trí phía dưới */
    .game-footer {
      margin-top: 10px;
      font-size: 12px;
      color: #a08060;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Tiêu đề trang trí -->
  <div class="game-header">
    <h1>WILD BOUNTY SHOWDOWN</h1>
  </div>

  <!-- Khung máy game trang trí -->
  <div class="arcade-cabinet">
    <!-- Nhúng web gốc vào đây, nó sẽ bị lớp .arcade-cabinet che các phần rìa đi -->
    <iframe class="game-screen" src="https://www.gameshub.com/free-games/slots/wild-bounty-showdown/" allowfullscreen></iframe>
  </div>

  <!-- Chân trang -->
  <div class="game-footer">
    Hosted on GitHub Pages | Designed for Custom UI
  </div>

</body>
</html>
