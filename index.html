<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild West Slot Machine Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #2b1704;
      background: radial-gradient(circle, #4a2810 0%, #150a02 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      background: #3a1e0b;
      border: 4px solid #d4af37;
      border-radius: 16px;
      padding: 24px;
      width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.3);
    }

    h1 {
      color: #f39c12;
      font-size: 24px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px #000;
    }

    .subtitle {
      font-size: 12px;
      color: #bdc3c7;
      margin-bottom: 20px;
    }

    .dashboard {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #5c3a21;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #f1c40f;
    }

    .reels-wrapper {
      display: flex;
      justify-content: space-between;
      background: #111;
      padding: 12px;
      border-radius: 12px;
      border: 3px solid #8e5a2b;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .reel {
      width: 30%;
      height: 90px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      user-select: none;
      transition: transform 0.1s ease-in-out;
    }

    .reel.spinning {
      filter: blur(2px);
    }

    .message {
      height: 24px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #2ecc71;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px 0;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .btn-spin {
      background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
      color: #fff;
      box-shadow: 0 4px 0 #962d00;
    }

    .btn-spin:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #962d00;
    }

    .btn-spin:disabled {
      background: #7f8c8d;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-reset {
      flex: 0.4;
      background: #7f8c8d;
      color: #fff;
      box-shadow: 0 4px 0 #34495e;
    }

    .btn-reset:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #34495e;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>WILD WEST SLOT</h1>
    <div class="subtitle">Demo Game Nổ Hũ HTML5</div>

    <div class="dashboard">
      <div class="stat-box">
        <span class="stat-label">Số Dư</span>
        <span class="stat-value" id="balance">1000</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Tiền Cược</span>
        <span class="stat-value" id="bet">50</span>
      </div>
    </div>

    <div class="reels-wrapper">
      <div class="reel" id="reel1">🤠</div>
      <div class="reel" id="reel2">🤠</div>
      <div class="reel" id="reel3">🤠</div>
    </div>

    <div class="message" id="message">Nhấn QUAY để bắt đầu!</div>

    <div class="controls">
      <button class="btn-spin" id="spinBtn" onclick="spin()">QUAY 🎰</button>
      <button class="btn-reset" onclick="resetGame()">Nạp Lại</button>
    </div>
  </div>

  <script>
    const symbols = ['🤠', '⭐️', '🌵', '💰', '🪙'];
    const BET_AMOUNT = 50;
    
    let balance = parseInt(localStorage.getItem('slot_balance')) || 1000;
    let isSpinning = false;

    const balanceEl = document.getElementById('balance');
    const messageEl = document.getElementById('message');
    const spinBtn = document.getElementById('spinBtn');
    const reels = [
      document.getElementById('reel1'),
      document.getElementById('reel2'),
      document.getElementById('reel3')
    ];

    function updateBalanceUI() {
      balanceEl.innerText = balance;
      localStorage.setItem('slot_balance', balance);
    }

    updateBalanceUI();

    function getRandomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function spin() {
      if (isSpinning) return;
      if (balance < BET_AMOUNT) {
        messageEl.style.color = '#e74c3c';
        messageEl.innerText = 'Bạn đã hết tiền! Nhấn Nạp Lại.';
        return;
      }

      // Trừ tiền cược
      balance -= BET_AMOUNT;
      updateBalanceUI();
      
      isSpinning = true;
      spinBtn.disabled = true;
      messageEl.innerText = 'Đang quay...';
      messageEl.style.color = '#f1c40f';

      // Thêm hiệu ứng quay
      reels.forEach(reel => reel.classList.add('spinning'));

      let intervalCount = 0;
      const spinInterval = setInterval(() => {
        reels.forEach(reel => {
          reel.innerText = getRandomSymbol();
        });
        intervalCount++;

        if (intervalCount > 15) {
          clearInterval(spinInterval);
          stopSpin();
        }
      }, 80);
    }

    function stopSpin() {
      const finalSymbols = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];

      reels.forEach((reel, index) => {
        reel.classList.remove('spinning');
        reel.innerText = finalSymbols[index];
      });

      checkWin(finalSymbols);
      isSpinning = false;
      spinBtn.disabled = false;
    }

    function checkWin(results) {
      const [s1, s2, s3] = results;

      if (s1 === s2 && s2 === s3) {
        // Nổ hũ - 3 biểu tượng giống nhau
        let winAmount = BET_AMOUNT * 10;
        if (s1 === '🤠') winAmount = BET_AMOUNT * 20; // JackPot Cowboy

        balance += winAmount;
        messageEl.style.color = '#2ecc71';
        messageEl.innerText = `🎉 THẮNG LỚN! +${winAmount} Xu!`;
      } else if (s1 === s2 || s2 === s3 || s1 === s3) {
        // Trúng 2 biểu tượng giống nhau
        const winAmount = BET_AMOUNT * 2;
        balance += winAmount;
        messageEl.style.color = '#2ecc71';
        messageEl.innerText = `👍 Trúng Nhỏ! +${winAmount} Xu!`;
      } else {
        messageEl.style.color = '#bdc3c7';
        messageEl.innerText = 'Chúc bạn may mắn lần sau!';
      }

      updateBalanceUI();
    }

    function resetGame() {
      if (isSpinning) return;
      balance = 1000;
      updateBalanceUI();
      messageEl.style.color = '#2ecc71';
      messageEl.innerText = 'Đã khôi phục 1000 Xu!';
    }
  </script>
</body>
</html>
