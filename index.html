<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild Bounty Showdown - Demo Clone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0d0603;
      background-image: radial-gradient(circle, #3a1e0b 0%, #0d0603 100%);
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Khung giả lập màn hình dọc giống di động */
    .mobile-screen {
      width: 100%;
      max-width: 380px;
      height: 720px;
      background: #1c0e06;
      border: 3px solid #b8860b;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
      overflow: hidden;
      position: relative;
    }

    /* Header & Banner */
    .header {
      background: linear-gradient(180deg, #5a2e0e, #2d1707);
      padding: 12px;
      text-align: center;
      border-bottom: 2px solid #b8860b;
    }

    .game-title {
      font-size: 18px;
      font-weight: bold;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px #000;
    }

    .multiplier-bar {
      background: rgba(0, 0, 0, 0.6);
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      color: #f39c12;
      border: 1px solid #795548;
    }

    /* Slot Machine Grid */
    .slot-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background: rgba(0,0,0,0.3);
    }

    .reels-board {
      display: flex;
      gap: 6px;
      background: #120904;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #8b5a2b;
      box-shadow: inset 0 0 10px #000;
    }

    .reel {
      width: 58px;
      height: 240px;
      background: #2a160a;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #4a2812;
      position: relative;
    }

    .symbol-container {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0;
      width: 100%;
      transition: transform 0.1s linear;
    }

    .symbol {
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    /* Overlay kết quả & Thông báo */
    .status-msg {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      color: #ffd700;
      height: 20px;
      margin-bottom: 4px;
    }

    /* Thanh Thống Kê Số Dư */
    .dash-bar {
      display: flex;
      justify-content: space-around;
      background: #0f0703;
      padding: 8px 0;
      border-top: 1px solid #5c3a21;
      border-bottom: 1px solid #5c3a21;
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      color: #a08060;
    }

    .stat-val {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
    }

    /* Bảng Điều Khiển Giống PG Soft */
    .footer-controls {
      background: #170b04;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #3a1e0b;
      border: 1px solid #b8860b;
      color: #ffd700;
      font-size: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .btn-circle:active {
      transform: scale(0.92);
    }

    .spin-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe066 0%, #d4af37 50%, #8b5a2b 100%);
      border: 3px solid #fff;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      color: #3a1e0b;
    }

    .spin-btn:active {
      transform: scale(0.95);
    }

    .spin-btn:disabled {
      filter: grayscale(0.8);
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="mobile-screen">
    <!-- Header -->
    <div class="header">
      <div class="game-title">WILD BOUNTY</div>
      <div class="multiplier-bar">HỆ SỐ THẮNG: <span id="multiplier">X1</span></div>
    </div>

    <!-- Khung Slot Machine -->
    <div class="slot-container">
      <div class="reels-board">
        <div class="reel"><div class="symbol-container" id="reel0"></div></div>
        <div class="reel"><div class="symbol-container" id="reel1"></div></div>
        <div class="reel"><div class="symbol-container" id="reel2"></div></div>
        <div class="reel"><div class="symbol-container" id="reel3"></div></div>
        <div class="reel"><div class="symbol-container" id="reel4"></div></div>
      </div>
    </div>

    <!-- Thông báo & Dashboard -->
    <div>
      <div class="status-msg" id="statusMsg">Nhấn Nút Quay Để Bắt Đầu</div>
      <div class="dash-bar">
        <div class="stat-item">
          <div class="stat-label">VÀNG</div>
          <div class="stat-val" id="balance">1,000.00</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">CƯỢC</div>
          <div class="stat-val" id="bet">10.00</div>
        </div>
      </div>
    </div>

    <!-- Thanh Nút Bấm Chơi -->
    <div class="footer-controls">
      <button class="btn-circle" onclick="adjustBet(-5)">-</button>
      <button class="btn-circle" onclick="adjustBet(5)">+</button>
      <button class="spin-btn" id="spinBtn" onclick="startSpin()">↻</button>
      <button class="btn-circle">⚡</button>
      <button class="btn-circle" onclick="resetMoney()">⚙</button>
    </div>
  </div>

  <script>
    // Danh sách Biểu Tượng theo phong cách PG Soft Showdown
    const symbols = ['🤠', '🔫', '🤠', '💰', '⭐', '🅰️', '🇰', '🇶', '🇯'];
    const BET_DEFAULT = 10;
    
    let balance = parseFloat(localStorage.getItem('pg_demo_bal')) || 1000;
    let currentBet = 10;
    let isSpinning = false;

    const reelElements = [
      document.getElementById('reel0'),
      document.getElementById('reel1'),
      document.getElementById('reel2'),
      document.getElementById('reel3'),
      document.getElementById('reel4')
    ];

    // Khởi tạo các biểu tượng ban đầu
    function initReels() {
      reelElements.forEach(container => {
        container.innerHTML = '';
        for (let i = 0; i < 6; i++) {
          const sym = document.createElement('div');
          sym.className = 'symbol';
          sym.innerText = getRandomSymbol();
          container.appendChild(sym);
        }
      });
      updateUI();
    }

    function getRandomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function updateUI() {
      document.getElementById('balance').innerText = balance.toFixed(2);
      document.getElementById('bet').innerText = currentBet.toFixed(2);
      localStorage.setItem('pg_demo_bal', balance);
    }

    function adjustBet(val) {
      if (isSpinning) return;
      if (currentBet + val >= 5 && currentBet + val <= balance) {
        currentBet += val;
        updateUI();
      }
    }

    function resetMoney() {
      if (isSpinning) return;
      balance = 1000;
      updateUI();
      document.getElementById('statusMsg').innerText = "Đã Khôi Phục 1,000 Vàng";
    }

    function startSpin() {
      if (isSpinning) return;
      if (balance < currentBet) {
        document.getElementById('statusMsg').innerText = "Số dư không đủ!";
        return;
      }

      balance -= currentBet;
      updateUI();
      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('statusMsg').innerText = "Đang Quay...";
      document.getElementById('multiplier').innerText = "X1";

      let completed = 0;

      reelElements.forEach((container, index) => {
        let count = 0;
        const speed = 50;
        const maxRounds = 15 + index * 5; // Hiệu ứng dừng từng cột từ trái sang phải

        const timer = setInterval(() => {
          const firstChild = container.firstElementChild;
          container.removeChild(firstChild);
          
          const newSym = document.createElement('div');
          newSym.className = 'symbol';
          newSym.innerText = getRandomSymbol();
          container.appendChild(newSym);

          count++;
          if (count >= maxRounds) {
            clearInterval(timer);
            completed++;
            if (completed === reelElements.length) {
              endSpin();
            }
          }
        }, speed);
      });
    }

    function endSpin() {
      isSpinning = false;
      document.getElementById('spinBtn').disabled = false;

      // Lấy danh sách kết quả hiển thị ở hàng giữa (dòng thứ 2)
      const results = reelElements.map(c => c.children[1].innerText);
      
      // Tính thưởng cơ bản
      const counts = {};
      results.forEach(x => { counts[x] = (counts[x] || 0) + 1; });

      let maxCombo = Math.max(...Object.values(counts));

      if (maxCombo >= 3) {
        const winAmount = currentBet * maxCombo * 2;
        balance += winAmount;
        document.getElementById('multiplier').innerText = `X${maxCombo}`;
        document.getElementById('statusMsg').innerText = `THẮNG LỚN: +${winAmount.toFixed(2)} Vàng!`;
      } else {
        document.getElementById('statusMsg').innerText = "Chúc Bạn May Mắn Lần Sau!";
      }

      updateUI();
    }

    // Chạy khởi tạo
    initReels();
  </script>
</body>
</html>
