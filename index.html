<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTips - Cộng Đồng Chia Sẻ Thủ Thuật & Code</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #131b2e;
            --surface-hover: #1a2540;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --accent-color: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .search-bar {
            position: relative;
            width: 400px;
        }

        .search-bar input {
            width: 100%;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
        }

        .search-bar i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.7rem 1.25rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: var(--surface-hover);
            border-color: var(--text-muted);
        }

        .container {
            max-width: 1280px;
            margin: 2rem auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .sidebar, .search-bar { display: none; }
        }

        .sidebar {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 5rem;
        }

        .sidebar h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .category-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .category-item a:hover, .category-item.active a {
            background: var(--surface-hover);
            color: var(--text-main);
            transform: translateX(4px);
        }

        .category-item.active a {
            color: var(--accent-color);
        }

        .feed-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .post-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--primary-color);
            opacity: 0;
            transition: var(--transition);
        }

        .post-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .post-card:hover::before { opacity: 1; }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .author-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--surface-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-weight: 700;
            border: 1px solid var(--border-color);
        }

        .author-info h4 { font-size: 0.95rem; font-weight: 600; }
        .post-time { font-size: 0.8rem; color: var(--text-muted); }

        .post-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
            transition: var(--transition);
        }

        .post-card:hover .post-title { color: var(--accent-color); }

        .post-snippet {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .post-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .tag {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .post-stats {
            display: flex;
            gap: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .post-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* MODAL CHI TIẾT & BÌNH LUẬN */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-container {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            width: 90%; max-width: 700px;
            border-radius: 20px; padding: 2rem;
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh; overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-overlay.active .modal-container { transform: scale(1) translateY(0); }

        .modal-close {
            position: absolute; top: 1.5rem; right: 1.5rem;
            background: var(--surface-hover); border: none;
            color: var(--text-muted); width: 36px; height: 36px;
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; transition: var(--transition);
        }

        .modal-close:hover { background: #ef4444; color: white; }

        .modal-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; }

        .modal-body-content {
            color: var(--text-muted);
            line-height: 1.8; margin: 1.5rem 0;
            font-size: 1rem; white-space: pre-line;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        /* Nút thả tim & Thảo luận */
        .interaction-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .btn-like {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn-like.liked {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.05);
        }

        .btn-like:hover { transform: scale(1.05); }

        .comments-section h4 { font-size: 1.1rem; margin-bottom: 1rem; }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .comment-form input, .comment-form textarea {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .comment-form input:focus, .comment-form textarea:focus {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .comment-item {
            background: var(--bg-color);
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .comment-author {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .comment-text {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-code"></i> DevTips.vn
        </a>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm thủ thuật, source code...">
        </div>
        <div class="nav-actions">
            <a href="admin.html" class="btn btn-outline"><i class="fa-solid fa-user-shield"></i> Quản trị Admin</a>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <aside class="sidebar">
            <h3>Danh mục</h3>
            <ul class="category-list">
                <li class="category-item active"><a href="#"><i class="fa-solid fa-fire"></i> Tất cả bài viết</a></li>
                <li class="category-item"><a href="#"><i class="fa-solid fa-globe"></i> Web Development</a></li>
                <li class="category-item"><a href="#"><i class="fa-solid fa-shield-halved"></i> Bảo mật & Proxy</a></li>
                <li class="category-item"><a href="#"><i class="fa-solid fa-robot"></i> AI & Automations</a></li>
            </ul>
        </aside>

        <main class="feed">
            <div class="feed-header">
                <h1>Thủ Thuật Mới Nhất</h1>
            </div>
            <div class="post-list" id="postList"></div>
        </main>
    </div>

    <!-- Modal Chi Tiết Bài Viết & Bình Luận / Thả Tim -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-container">
            <button class="modal-close" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="modal-title" id="detailTitle"></h2>
            <div class="post-meta">
                <div class="author-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="author-info">
                    <h4 id="detailAuthor"></h4>
                    <span class="post-time" id="detailTime"></span>
                </div>
            </div>

            <div class="modal-body-content" id="detailContent"></div>

            <!-- Tương tác: Thả tim -->
            <div class="interaction-bar">
                <button class="btn-like" id="btnLikePost" onclick="toggleLikeCurrentPost()">
                    <i class="fa-solid fa-heart"></i> <span id="likeCountText">0</span> Thích
                </button>
            </div>

            <!-- Khu vực Bình luận ẩn danh -->
            <div class="comments-section">
                <h4>Thảo luận cộng đồng</h4>
                <form class="comment-form" id="commentForm">
                    <input type="text" id="commentAuthorInput" placeholder="Tên của bạn (Để trống sẽ là Ẩn danh)...">
                    <textarea id="commentContentInput" placeholder="Viết bình luận của bạn..." rows="2" required></textarea>
                    <button type="submit" class="btn btn-primary" style="align-self: flex-end; padding: 6px 16px; font-size: 0.85rem;">Gửi bình luận</button>
                </form>

                <div class="comment-list" id="commentList"></div>
            </div>
        </div>
    </div>

    <!-- Script Xử Lý Giao Diện, Tim & Bình Luận -->
    <script>
        const postListEl = document.getElementById('postList');
        const detailModal = document.getElementById('detailModal');
        let currentOpenPostId = null;

        let posts = JSON.parse(localStorage.getItem('devtips_posts')) || [];

        function renderHomePage() {
            postListEl.innerHTML = '';

            if (posts.length === 0) {
                postListEl.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-folder-open" style="font-size: 2.5rem; margin-bottom: 10px; color: var(--primary-color);"></i>
                        <p>Chưa có bài viết nào được đăng tải từ Admin.</p>
                    </div>
                `;
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.onclick = () => openDetailModal(post.id);
                
                const commentCount = post.comments ? post.comments.length : 0;
                const likesCount = post.likes || 0;

                card.innerHTML = `
                    <div class="post-meta">
                        <div class="author-avatar"><i class="fa-solid fa-user"></i></div>
                        <div class="author-info">
                            <h4>${post.author}</h4>
                            <span class="post-time">${post.time}</span>
                        </div>
                    </div>
                    <h2 class="post-title">${post.title}</h2>
                    <p class="post-snippet">${post.snippet}</p>
                    <div class="post-tags">
                        <span class="tag">${post.category}</span>
                    </div>
                    <div class="post-stats">
                        <span><i class="fa-solid fa-heart" style="color: ${post.likedByMe ? '#ef4444' : 'inherit'}"></i> ${likesCount} thích</span>
                        <span><i class="fa-regular fa-comment"></i> ${commentCount} bình luận</span>
                    </div>
                `;
                postListEl.appendChild(card);
            });
        }

        function openDetailModal(postId) {
            currentOpenPostId = postId;
            const post = posts.find(p => p.id === postId);
            if (!post) return;

            document.getElementById('detailTitle').innerText = post.title;
            document.getElementById('detailAuthor').innerText = post.author;
            document.getElementById('detailTime').innerText = post.time;
            document.getElementById('detailContent').innerText = post.content;

            updateLikeButtonUI(post);
            renderComments(post);

            detailModal.classList.add('active');
        }

        function closeDetailModal() {
            detailModal.classList.remove('active');
            currentOpenPostId = null;
        }

        // Thả tim bài viết
        function toggleLikeCurrentPost() {
            const post = posts.find(p => p.id === currentOpenPostId);
            if (!post) return;

            if (!post.likes) post.likes = 0;
            if (post.likedByMe) {
                post.likes -= 1;
                post.likedByMe = false;
            } else {
                post.likes += 1;
                post.likedByMe = true;
            }

            localStorage.setItem('devtips_posts', JSON.stringify(posts));
            updateLikeButtonUI(post);
            renderHomePage();
        }

        function updateLikeButtonUI(post) {
            const btnLike = document.getElementById('btnLikePost');
            const likeCountText = document.getElementById('likeCountText');
            likeCountText.innerText = post.likes || 0;
            if (post.likedByMe) {
                btnLike.classList.add('liked');
            } else {
                btnLike.classList.remove('liked');
            }
        }

        // Gửi bình luận ẩn danh
        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const authorInput = document.getElementById('commentAuthorInput').value.trim();
            const contentInput = document.getElementById('commentContentInput').value.trim();

            const authorName = authorInput === '' ? 'Ẩn danh' : authorInput;

            const post = posts.find(p => p.id === currentOpenPostId);
            if (!post) return;

            if (!post.comments) post.comments = [];
            post.comments.push({
                author: authorName,
                text: contentInput,
                time: 'Vừa xong'
            });

            localStorage.setItem('devtips_posts', JSON.stringify(posts));
            renderComments(post);
            renderHomePage();
            
            document.getElementById('commentContentInput').value = '';
            document.getElementById('commentAuthorInput').value = '';
        });

        function renderComments(post) {
            const commentListEl = document.getElementById('commentList');
            commentListEl.innerHTML = '';

            if (!post.comments || post.comments.length === 0) {
                commentListEl.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">Chưa có bình luận nào. Hãy là người đầu tiên thảo luận!</p>';
                return;
            }

            post.comments.slice().reverse().forEach(c => {
                commentListEl.innerHTML += `
                    <div class="comment-item">
                        <div class="comment-author">${c.author} <span style="font-weight: 400; color: var(--text-muted); font-size: 0.75rem;">• ${c.time}</span></div>
                        <div class="comment-text">${c.text}</div>
                    </div>
                `;
            });
        }

        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                closeDetailModal();
            }
        });

        // Tìm kiếm nhanh bài viết
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.post-card');
            cards.forEach(card => {
                const title = card.querySelector('.post-title').innerText.toLowerCase();
                const snippet = card.querySelector('.post-snippet').innerText.toLowerCase();
                if(title.includes(keyword) || snippet.includes(keyword)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        renderHomePage();
    </script>
</body>
</html>
